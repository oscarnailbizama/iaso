<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPS Passeport Pas Standardiser</title>

    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>

    <style>
        body {
            background-color: blue;
            font-family: sans-serif;
            text-align: center;
            height: 100vh;
            margin: 0;
            padding-bottom: 2em;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: crosshair;
        }

        h1 {
            font-size: 1vh;
        }

        h1:hover {
            font-size: 5vh;
            transition: 3s;
        }

        .container {
            display: grid;
            margin-left: 2em;
            margin-right: 2em;
            flex: 1;
            min-height: 0;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            grid-template-rows: repeat(12, minmax(0, 1fr));
            opacity: 40%;
            transition: opacity 0.5s;
            transform: scale(0.9);
            transform-origin: center;
        }

        .container:hover {
            opacity: 100%;
        }

        .container > div {
            position: relative;
            isolation: isolate;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background-color: #222;
            color: #fff;
            text-shadow: 0 0 0.5vh #000, 0 0 1vh #000;
            box-sizing: border-box;
            padding: 1vh;
            font-size: 1.8vh;
            text-align: left;
            overflow-wrap: anywhere;
            overflow: hidden;

            transition: transform 0.4s, background-color 0.5s, color 0.4s,
                        letter-spacing 0.4s, border-radius 0.4s,
                        box-shadow 0.4s, filter 0.4s;
        }

        .a-pays      { grid-area: 1 / 1 / 3 / 3; }
        .a-type      { grid-area: 1 / 3 / 2 / 5; }
        .a-code      { grid-area: 1 / 5 / 2 / 7; }
        .a-numero    { grid-area: 1 / 7 / 2 / 9; }

        .a-nom       { grid-area: 2 / 3 / 3 / 7; }
        .a-vide1     { grid-area: 2 / 7 / 4 / 9; }
        .a-prenom    { grid-area: 3 / 3 / 4 / 7; }
        .a-nation    { grid-area: 4 / 3 / 5 / 7; }
        .a-naissance { grid-area: 4 / 7 / 5 / 8; }

        .itemPhoto   { grid-area: 3 / 1 / 9 / 3; padding: 0; background-color: #222; }
        .itemMini    { grid-area: 4 / 8 / 7 / 9; padding: 0; background-color: #222; }

        .a-sexe      { grid-area: 5 / 3 / 6 / 5; }
        .a-taille    { grid-area: 5 / 5 / 6 / 7; }
        .a-element   { grid-area: 5 / 7 / 7 / 8; }
        .a-lieu      { grid-area: 6 / 3 / 7 / 7; }
        .a-date      { grid-area: 7 / 3 / 8 / 5; }
        .a-validite  { grid-area: 7 / 5 / 8 / 7; }
        .a-signature { grid-area: 7 / 7 / 9 / 9; }
        .a-autorite  { grid-area: 8 / 3 / 9 / 7; }

        .a-vide3     { grid-area: 9 / 1 / 10 / 9; }

        .itemMRZ {
            grid-area: 10 / 1 / 13 / 9;
            border-radius: 0 0 3vh 3vh;
            font-family: monospace;
            flex-direction: column;
        }

        .container > div.itemMRZ {
            justify-content: space-around;
            align-items: flex-start;
        }

        .fit {
            display: inline-block;
            margin: 0;
            padding: 0;
            font-size: 16px;
            font-weight: 700;
            line-height: 0.85;
            white-space: nowrap;
            text-align: left;
        }

        .flag {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        .flag.show {
            opacity: 1;
        }

        .a-pays.is-active .flag {
            visibility: hidden;
        }

        .bg-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            pointer-events: none;
            transition: opacity 0.4s;
        }

        .container > div.is-active > .bg-video {
            opacity: 0;
        }

        .webcam {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none;
            outline: none;
        }

        .faceCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .mrz-line {
            display: flex;
            width: max-content;
        }

        .container > div.is-active {
            z-index: 2;
            color: #000;
            text-shadow: none;
            background-color: hsl(var(--h, 120) 90% 55%);
        }

        .container > div.is-active.v-lower {
            text-transform: lowercase;
            transform: scale(1.15);
        }
        .container > div.is-active.v-upper {
            text-transform: uppercase;
            letter-spacing: 0.2em;
            transform: scale(1.08);
        }
        .container > div.is-active.v-rotate {
            transform: rotate(-4deg) scale(1.15);
        }
        .container > div.is-active.v-skew {
            transform: skewX(-12deg) scale(1.1);
        }
        .container > div.is-active.v-mirror {
            transform: scaleX(-1);
        }
        .container > div.is-active.v-terminal {
            background-color: #000;
            color: #0f0;
            font-family: monospace;
            text-transform: uppercase;
            transform: scale(1.1);
        }
        .container > div.is-active.v-blur {
            filter: blur(2px);
            transform: scale(1.1);
        }
        .container > div.is-active.v-shadow {
            box-shadow: 1vh 1vh 0 #000;
            transform: translate(-1vh, -1vh);
        }
        .container > div.is-active.v-serif {
            font-family: Georgia, serif;
            font-style: italic;
            transform: scale(1.15);
        }
        .container > div.is-active.v-spin {
            transform: rotate(360deg) scale(1.1);
        }
        .container > div.is-active.v-dashed {
            outline: 0.5vh dashed #000;
            outline-offset: -1vh;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<h1><p>Passeport de nouvelle génération</p></h1>

<div class="container">

    <div class="a-pays">
        <img id="flagA" class="flag" alt="">
        <img id="flagB" class="flag" alt="">
        <span class="fit">PASSEPORT</span>
    </div>

    <div class="a-type"><span class="fit">TYPE</span></div>
    <div class="a-code"><span class="fit">CODE</span></div>
    <div class="a-numero"><span class="fit">NUMÉRO</span></div>

    <div class="a-nom"><span class="fit">NOM</span></div>
    <div class="a-vide1"></div>
    <div class="a-prenom"><span class="fit">PRÉNOM</span></div>
    <div class="a-nation"><span class="fit">NATIONALITÉ</span></div>
    <div class="a-naissance"><span class="fit">NAISSANCE</span></div>

    <div class="itemPhoto">
        <video id="webcam" class="webcam" autoplay playsinline muted></video>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <div class="itemMini">
        <video id="webcamMini" class="webcam" autoplay playsinline muted></video>
        <canvas id="faceCanvas" class="faceCanvas"></canvas>
    </div>

    <div class="a-sexe"><span class="fit">SEXE</span></div>
    <div class="a-taille"><span class="fit">TAILLE</span></div>
    <div class="a-element"><span class="fit">HOLOGRAMME</span></div>
    <div class="a-lieu"><span class="fit">LIEU ORIGINE</span></div>
    <div class="a-date"><span class="fit">ÉMISSION 01 01 9999</span></div>
    <div class="a-validite"><span class="fit">30 12 9999 VALIDITÉ</span></div>
    <div class="a-signature"><span class="fit">SIGNATURE</span></div>
    <div class="a-autorite"><span class="fit">AUTORITÉ</span></div>

    <div class="a-vide3"></div>

    <div class="itemMRZ">
        <div class="mrz-line fit" data-share="2">DOCUMENT&lt;DE&lt;VOYAGE&lt;&lt;LISIBLE&lt;PAR&lt;MACHINE&lt;&lt;&lt;&lt;&lt;</div>
        <div class="mrz-line fit" data-share="2">©&lt;2026&lt;&lt;OSCAR&lt;&lt;NAIL&lt;BIZAMA&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;</div>
    </div>
</div>

<script>
console.log("sick-project");

const FLAG_BASE     = 'https://flagcdn.com/w640/';
const FLAG_EXT      = '.png';
const FLAG_INTERVAL = 1500;
const FLAGS = [
    'cl','ad','ae','af','ag','al','am','ao','ar','at','au','az','ba','bb','bd','be','bf','bg','bh','bi',
    'bj','bn','bo','br','bs','bt','bw','by','bz','ca','cd','cf','cg','ch','ci','cm','cn','co','cr','cu',
    'cv','cy','cz','de','dj','dk','dm','do','dz','ec','ee','eg','er','es','et','fi','fj','fm','fr','ga',
    'gb','gd','ge','gh','gm','gn','gq','gr','gt','gw','gy','hn','hr','ht','hu','id','ie','il','in','iq',
    'ir','is','it','jm','jo','jp','ke','kg','kh','ki','km','kn','kp','kr','kw','kz','la','lb','lc','li',
    'lk','lr','ls','lt','lu','lv','ly','ma','mc','md','me','mg','mh','mk','ml','mm','mn','mr','mt','mu',
    'mv','mw','mx','my','mz','na','ne','ng','ni','nl','no','np','nr','nz','om','pa','pe','pg','ph','pk',
    'pl','ps','pt','pw','py','qa','ro','rs','ru','rw','sa','sb','sc','sd','se','sg','si','sk','sl','sm',
    'sn','so','sr','ss','st','sv','sy','sz','td','tg','th','tj','tl','tm','tn','to','tr','tt','tv','tw',
    'tz','ua','ug','us','uy','uz','va','vc','ve','vn','vu','ws','xk','ye','za','zm','zw'
];

document.querySelectorAll('.mrz-line').forEach(line => {
    const chars = [...line.textContent.trim()];
    line.textContent = '';
    chars.forEach(c => {
        const s = document.createElement('span');
        s.textContent = c;
        line.appendChild(s);
    });
});

const bgVideos = [];
document.querySelectorAll('.container > div:not(.itemPhoto):not(.itemMini):not(.a-pays)').forEach(cell => {
    const v = document.createElement('video');
    v.className = 'bg-video';
    v.autoplay = true;
    v.muted = true;
    v.setAttribute('muted', '');
    v.setAttribute('playsinline', '');
    cell.prepend(v);
    bgVideos.push(v);
});

const video = document.getElementById('webcam');
const videoMini = document.getElementById('webcamMini');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => {
        [video, videoMini, ...bgVideos].forEach(v => {
            v.srcObject = stream;
            const p = v.play();
            if (p && p.catch) p.catch(() => {});
        });
    })
    .catch(err => console.error("Error:", err));

const grid = document.querySelector('.container');
const COLS = 8, ROWS = 12;

const target = { x: 0.5, y: 0.5, amp: 0 };
const state  = { x: 0.5, y: 0.5, amp: 0 };
let pressed = false;

function weights(count, pos, amp) {
    const sigma = 0.22;
    const out = [];
    for (let i = 0; i < count; i++) {
        const center = (i + 0.5) / count;
        const d = (pos - center) / sigma;
        out.push(0.35 + amp * Math.exp(-d * d));
    }
    return out;
}

function applyGrid() {
    const cw = weights(COLS, state.x, state.amp);
    const rw = weights(ROWS, state.y, state.amp);
    grid.style.gridTemplateColumns = cw.map(w => `minmax(0, ${w.toFixed(3)}fr)`).join(' ');
    grid.style.gridTemplateRows    = rw.map(w => `minmax(0, ${w.toFixed(3)}fr)`).join(' ');
}

const fitItems = [...document.querySelectorAll('.fit')].map(el => ({
    el,
    cell: el.closest('.container > div'),
    share: parseFloat(el.dataset.share) || 1,
    size: 16
}));

function fitAll() {
    const pad = window.innerHeight * 0.02;

    for (const it of fitItems) {
        it.w  = it.cell.clientWidth - pad;
        it.h  = (it.cell.clientHeight - pad) / it.share;
        it.ow = it.el.offsetWidth;
        it.oh = it.el.offsetHeight;
    }

    for (const it of fitItems) {
        if (!it.ow || !it.oh || it.w <= 0 || it.h <= 0) continue;
        const k = Math.min(it.w / it.ow, it.h / it.oh);
        if (Math.abs(k - 1) < 0.01) continue;
        it.size = Math.min(600, Math.max(4, it.size * k));
        it.el.style.fontSize = it.size + 'px';
    }
}

function tick() {
    state.x   += (target.x   - state.x)   * 0.12;
    state.y   += (target.y   - state.y)   * 0.12;
    state.amp += (target.amp - state.amp) * 0.10;
    applyGrid();
    fitAll();
    requestAnimationFrame(tick);
}

grid.addEventListener('pointermove', e => {
    const r = grid.getBoundingClientRect();
    target.x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    target.y = Math.min(1, Math.max(0, (e.clientY - r.top)  / r.height));
    target.amp = pressed ? 5 : 1.6;
});
grid.addEventListener('pointerdown', () => { pressed = true;  target.amp = 5; });
window.addEventListener('pointerup',  () => { pressed = false; target.amp = 1.6; });
grid.addEventListener('pointerleave', () => { target.amp = 0; });

requestAnimationFrame(tick);

const variants = [
    'v-lower', 'v-upper', 'v-rotate', 'v-skew', 'v-mirror',
    'v-terminal', 'v-blur', 'v-shadow', 'v-serif', 'v-spin', 'v-dashed'
];

document.querySelectorAll('.container > div:not(.itemPhoto):not(.itemMini)').forEach(cell => {
    let current = null;

    cell.addEventListener('mouseenter', () => {
        let next;
        do {
            next = variants[Math.floor(Math.random() * variants.length)];
        } while (next === current && variants.length > 1);
        current = next;

        cell.style.setProperty('--h', Math.floor(Math.random() * 360));
        cell.classList.add('is-active', current);
    });

    cell.addEventListener('mouseleave', () => {
        cell.classList.remove('is-active', ...variants);
    });
});

const flagEls = [document.getElementById('flagA'), document.getElementById('flagB')];
let flagFront = 1;
let flagIdx   = 0;
let flagFails = 0;

function nextFlag() {
    const url = FLAG_BASE + FLAGS[flagIdx] + FLAG_EXT;
    flagIdx = (flagIdx + 1) % FLAGS.length;

    const loader = new Image();
    loader.onload = () => {
        flagFails = 0;
        const back = flagEls[1 - flagFront];
        back.src = url;
        back.classList.add('show');
        flagEls[flagFront].classList.remove('show');
        flagFront = 1 - flagFront;
        setTimeout(nextFlag, FLAG_INTERVAL);
    };
    loader.onerror = () => {
        flagFails++;
        if (flagFails < FLAGS.length) {
            nextFlag();
        } else {
            console.warn('Aucun drapeau chargé : vérifie FLAG_BASE et FLAGS.');
        }
    };
    loader.src = url;
}
nextFlag();

const faceCanvas = document.getElementById('faceCanvas');
const fctx = faceCanvas.getContext('2d');

let faceapi;
let detections = [];

const faceOptions = { withLandmarks: true, withExpressions: false, withDescriptors: false };

videoMini.addEventListener('loadeddata', () => {
    if (typeof ml5 === 'undefined') {
        console.warn('ml5 non chargé : pas de détection de visage.');
        return;
    }
    videoMini.width  = videoMini.videoWidth;
    videoMini.height = videoMini.videoHeight;

    faceapi = ml5.faceApi(videoMini, faceOptions, faceReady);
    requestAnimationFrame(drawFace);
});

function faceReady() {
    faceapi.detect(gotFaces);
}

function gotFaces(error, result) {
    if (error) {
        console.log(error);
        return;
    }
    detections = result || [];
    faceapi.detect(gotFaces);
}

function drawFace() {
    const cw = faceCanvas.clientWidth;
    const ch = faceCanvas.clientHeight;
    if (faceCanvas.width !== cw || faceCanvas.height !== ch) {
        faceCanvas.width = cw;
        faceCanvas.height = ch;
    }
    fctx.clearRect(0, 0, cw, ch);

    const vw = videoMini.videoWidth;
    const vh = videoMini.videoHeight;

    if (detections.length > 0 && vw && vh) {
        const scale = Math.max(cw / vw, ch / vh);
        const offX = (cw - vw * scale) / 2;
        const offY = (ch - vh * scale) / 2;
        const r = Math.max(1.5, Math.min(cw, ch) / 60);

        const points = detections[0].landmarks.positions;
        fctx.fillStyle = 'rgb(161, 95, 251)';
        for (let i = 0; i < points.length; i++) {
            const x = points[i]._x * scale + offX;
            const y = points[i]._y * scale + offY;
            fctx.beginPath();
            fctx.arc(x, y, r, 0, Math.PI * 2);
            fctx.fill();
        }
    }
    requestAnimationFrame(drawFace);
}
</script>

</body>
</html>
